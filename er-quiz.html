<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חידון מיון</title>
    <link rel="stylesheet" href="er-styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>חידון מיון</h1>
            <p class="subtitle">דף חזרה למיון – תרופות, מצבים רפואיים והתאמת טיפול</p>
        </header>

        <div id="stats" class="stats">
            <div class="stat-item">
                <span class="stat-label">שאלה:</span>
                <span id="question-number">1</span> / <span id="total-questions">10</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">ניקוד:</span>
                <span id="score">0</span>
            </div>
        </div>

        <div id="quiz-container" class="quiz-container">
            <div id="question-card" class="question-card">
                <div id="question-category" class="question-category"></div>
                <h2 id="question-text" class="question-text"></h2>
                <div id="options" class="options"></div>
            </div>

            <div id="feedback" class="feedback hidden">
                <div id="feedback-icon" class="feedback-icon"></div>
                <p id="feedback-text"></p>
                <p id="explanation" class="explanation"></p>
            </div>

            <button id="next-btn" class="btn next-btn hidden">השאלה הבאה</button>
        </div>

        <div id="results" class="results hidden">
            <h2>סיכום</h2>
            <div class="results-score">
                <span id="final-score">0</span> / <span id="final-total">10</span>
            </div>
            <p id="results-message"></p>
            <button id="restart-btn" class="btn">התחל מחדש</button>
        </div>

        <div id="settings" class="settings">
            <h3>הגדרות</h3>
            <div class="setting-item">
                <label for="question-count">מספר שאלות:</label>
                <select id="question-count">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="category-select">קטגוריה:</label>
                <select id="category-select">
                    <option value="all" selected>הכל</option>
                    <option value="משככי כאבים">משככי כאבים</option>
                    <option value="תרופות לב והפרעות קצב">תרופות לב והפרעות קצב</option>
                    <option value="נוגדי קרישה וטסיות">נוגדי קרישה וטסיות</option>
                    <option value="תרופות מערכת העיכול">תרופות מערכת העיכול</option>
                    <option value="אנטיהיסטמין וסדטיבים">אנטיהיסטמין וסדטיבים</option>
                    <option value="מרחיבי סמפונות וסטרואידים">מרחיבי סמפונות וסטרואידים</option>
                    <option value="אנטיביוטיקה">אנטיביוטיקה</option>
                    <option value="נוזלים וטיפול בפצעים">נוזלים וטיפול בפצעים</option>
                    <option value="תרופות חשובות נוספות במיון">תרופות חשובות נוספות במיון</option>
                    <option value="מצבים נוירולוגיים">מצבים נוירולוגיים</option>
                    <option value="מצבים נשימתיים">מצבים נשימתיים</option>
                    <option value="מצבים קרדיאליים">מצבים קרדיאליים</option>
                    <option value="אלקטרוליטים, אנדוקריני ואלרגיה">אלקטרוליטים, אנדוקריני ואלרגיה</option>
                    <option value="מערכת העיכול והבטן">מערכת העיכול והבטן</option>
                    <option value="כליות ודרכי השתן">כליות ודרכי השתן</option>
                    <option value="כלי דם, עור ושברים">כלי דם, עור ושברים</option>
                    <option value="הרעלות ושוק">הרעלות ושוק</option>
                    <option value="התאמת טיפול למצב">התאמת טיפול למצב</option>
                </select>
            </div>
            <button id="start-btn" class="btn start-btn">התחל חידון</button>
        </div>
        <div class="nav-links">
            <a href="public-health-quiz.html" class="nav-link">חידון בריאות הציבור</a>
            <a href="nursing-quiz.html" class="nav-link">חידון סיעודי</a>
            <a href="nutrition-quiz.html" class="nav-link">חידון תזונה ודיאטטיקה</a>
            <a href="internal-quiz.html" class="nav-link">חידון פנימיות ב'</a>
        </div>
    </div>

    <script src="er.js"></script>
    <script src="er-quiz.js"></script>
</body>
</html>
